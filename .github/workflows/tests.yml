name: Tests (self-hosted)

# Deliberately do not run untrusted pull_request code on a self-hosted runner.
on:
  push:
    branches: [main]
    # Central Runner Fabric policy-only commits are not product releases.
    # Preserve all other main-push and manual release/test behavior.
    paths-ignore:
      - 'AGENTS.md'
      - '.github/owner-runner-fabric/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
