name: Docker build (self-hosted)

# Only code on main (or manually dispatched from main) reaches the runner.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - requirements.txt
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, auto-telegram-news]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
