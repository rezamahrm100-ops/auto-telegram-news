name: Publish release image (self-hosted)

# Build a container only for an existing, approved GitHub Release.
# Never run this workflow for pull_request events on a self-hosted machine.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published GitHub Release tag, e.g. v1.8.2"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, auto-telegram-news]
    timeout-minutes: 120
    steps:
      - name: Verify an existing published GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/.test(tag)) {
              core.setFailed('Release tag must look like v1.8.2');
              return;
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            if (release.draft) {
              core.setFailed('Publish the GitHub Release before publishing its image');
            }

      - name: Check out the approved release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
